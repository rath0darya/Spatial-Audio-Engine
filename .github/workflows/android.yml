name: Android APK Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spatial-audio-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle 8.9
        run: |
          curl --fail --location --retry 3 --retry-all-errors https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --version

      - name: Build debug APK
        run: /tmp/gradle-8.9/bin/gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify and name APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Spatial-Audio-Engine-v0.3.2.apk
          test -s release-output/Spatial-Audio-Engine-v0.3.2.apk
          ls -lh release-output/Spatial-Audio-Engine-v0.3.2.apk

      - name: Remove outdated releases and APK assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          releases="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          while IFS=$'\t' read -r release_id tag_name; do
            [ -n "$release_id" ] || continue
            echo "Deleting outdated release $tag_name (id $release_id)"
            curl --fail --silent --show-error -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id"
            code="$(curl --silent --show-error -o /dev/null -w "%{http_code}" -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/tags/$tag_name")"
            [[ "$code" == "204" || "$code" == "404" ]]
          done < <(printf '%s' "$releases" | python3 -c 'import json,sys; [print(str(r["id"])+"\t"+r["tag_name"]) for r in json.load(sys.stdin)]')

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v0.3.2-build.${{ github.run_number }}
          name: Spatial Audio Engine v0.3.2 — Build ${{ github.run_number }}
          body: |
            Spatial Audio Engine v0.3.2 — real-time PCM DSP effects for supported direct audio streams.

            This is a virtual stereo DSP prototype, not Dolby Atmos-certified. Stream compatibility depends on the source format and device.
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-output/Spatial-Audio-Engine-v0.3.2.apk
          fail_on_unmatched_files: true
          make_latest: true
