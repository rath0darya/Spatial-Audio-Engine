name: Android APK Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spatial-audio-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle 8.9
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build debug APK
        run: /tmp/gradle-8.9/bin/gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-build.${{ github.run_number }}
          name: Spatial Audio Engine v0.1.0 — Build ${{ github.run_number }}
          body: |
            Automated Android APK build from the main branch.

            **Prototype limitation:** this release tests Android playback-capture feasibility and signal detection only. It does not yet apply a spatial effect to YouTube's audible output or replace the system audio stream.
          draft: false
          prerelease: true
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
